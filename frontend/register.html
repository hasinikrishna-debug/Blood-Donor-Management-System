<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Donor | LifeFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
    <div class="logo">🩸 LifeFlow</div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="register.html">Become a Donor</a>
        <a href="donors.html">Find Donors</a>
    </div>
</nav>

<section class="form-section">

    <div class="form-card">

        <h1>Become a Blood Donor</h1>
        <p>Register your details and help someone in need.</p>

        <form id="donorForm">

            <label>Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <div class="two-columns">

                <div>
                    <label>Age</label>
                    <input
                        type="number"
                        id="age"
                        placeholder="Age"
                        required
                    >
                </div>

                <div>
                    <label>Gender</label>
                    <select id="gender" required>
                        <option value="">Select</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

            </div>

            <label>Blood Group</label>

            <select id="bloodGroup" required>
                <option value="">Select blood group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <label>Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                required
            >

            <label>City</label>

            <input
                type="text"
                id="city"
                placeholder="Enter your city"
                required
            >

            <button type="submit" class="btn primary">
                Register as Donor
            </button>

        </form>

    </div>

</section>

<script src="js/app.js"></script>

</body>
</html>
